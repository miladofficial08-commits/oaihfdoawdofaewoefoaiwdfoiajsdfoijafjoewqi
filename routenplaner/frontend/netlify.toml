# Netlify veröffentlicht dieses Verzeichnis unverändert — kein Buildschritt,
# keine Abhängigkeiten, keine Build-Minuten.
#
# Im Netlify-Dienst einstellen:
#   Base directory:    routenplaner/frontend
#   Build command:     (leer lassen)
#   Publish directory: routenplaner/frontend

[build]
  publish = "."
  command = ""

# Die Backend-Adresse trägt man beim ersten Öffnen in der App ein; sie steckt
# deshalb nicht hier drin und man kann dasselbe Frontend gegen Test- und
# Produktivbackend laufen lassen.

[[headers]]
  for = "/*"
  [headers.values]
    # Die Seite lädt Leaflet vom CDN, Kartenkacheln von OpenStreetMap und
    # spricht mit dem eigenen Backend. connect-src bleibt offen, weil die
    # Backend-Adresse erst im Browser eingetragen wird.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https://*.tile.openstreetmap.org https://cdnjs.cloudflare.com; connect-src *; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    # Die Seite selbst nie aus dem Cache: sonst sieht man nach einem Deploy
    # tagelang die alte Fassung.
    Cache-Control = "no-cache"
